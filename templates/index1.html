
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jatt Pizza Club</title>
</head>

<body>

    <h1>Pizza's</h1>

    <ul>
        {% for pizza, detail in pizza.items() %}
            <li>
                {{ pizza }} - ${{ detail.price }}
            </li>
        {% endfor %}
    </ul>

    <h2>Drinks Available</h2>

    <ul>
        {% for drink, detail in drinks.items() %}
            <li>
                {{ drink }} - ${{ detail.price }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
